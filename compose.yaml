services:
  inventory-postgres:
    image: 'postgres:16-alpine'
    container_name: erp-inventory-postgres
    environment:
      - POSTGRES_DB=erp_inventory_db
      - POSTGRES_USER=inventory_user
      - POSTGRES_PASSWORD=inventory_secret
    ports:
      - '5436:5432'
    volumes:
      - postgres_inventory_data:/var/lib/postgresql/data

volumes:
  postgres_inventory_data:
